<!doctype html>
<html lang="tr" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Frigora</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <nav class="navbar app-navbar border-bottom">
      <div class="container-fluid navbar-inner">
        <button class="btn-subtle theme-secondary menu-toggle" type="button" data-bs-toggle="drawer" data-bs-target="#side-drawer" aria-controls="side-drawer" aria-label="Yan menüyü aç">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" /></svg>
        </button>
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <img src="/assets/logo.svg" alt="" width="28" height="28" />Frigora
        </a>
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="/" aria-current="page" data-nav="/">Pano</a></li>
        </ul>
        <div class="profile-menu">
          <button class="btn-subtle theme-secondary profile-trigger" type="button" data-bs-toggle="menu" data-bs-placement="bottom-end" aria-controls="profile-menu" aria-expanded="false" aria-label="Profil menüsü">
            <span id="user-avatar" class="user-avatar">?</span>
            <span id="user-name">Misafir</span>
            <svg class="profile-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
          </button>
          <div class="menu profile-dropdown" id="profile-menu">
            <div class="px-3 py-2">
              <div id="user-fullname" class="fw-semibold">—</div>
              <small id="user-role" class="fg-2"></small>
              <div><span id="session-badge" class="badge badge-subtle theme-secondary mt-1">…</span></div>
            </div>
            <hr class="menu-divider" />
            <button id="logout-btn" class="menu-item logout" type="button">Çıkış yap</button>
          </div>
        </div>
      </div>
    </nav>
    <div class="app-shell">
    <dialog class="drawer drawer-start side-drawer" tabindex="-1" id="side-drawer" aria-labelledby="side-drawer-label">
      <div class="drawer-header">
        <h5 class="drawer-title" id="side-drawer-label">Menü</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Kapat"></button>
      </div>
      <div class="drawer-body">
        <div class="side-section-title">Cihazlar</div>
        <ul id="side-devices" class="side-devices list-unstyled" tabindex="0" aria-label="Cihaz listesi">
          <li class="fg-2 px-2">Yükleniyor…</li>
        </ul>
        <hr class="menu-divider" />
        <a class="side-link" href="/records">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h6l3 3v10H4zM10 1.5v3h3M6 8h5M6 11h5" /></svg>
          Kayıt tutanakları
        </a>
      </div>
    </dialog>
    <main id="app" class="container py-3"></main>
    </div>
    <script type="importmap">
      { "imports": { "@yigithsyn/logger": "/node_modules/@yigithsyn/logger/index.js" } }
    </script>
    <script type="module" src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
